[workspace]
resolver = "3"
members = [
    "kurogane",
    "kurogane-cli",
    "kurogane-layout",
    "kurogane-suite"
]

[workspace.package]
version = "0.0.6-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = [
    "Piyush Raj <hello@piyushraj.org>"
]
repository = "https://github.com/0x48piraj/kurogane"

[workspace.dependencies]
tetsu = { git = "https://github.com/kurogane-rs/tetsu", rev = "0a469a1e9987b00b75c4150db51efa7545d5018f", default-features = false }
download-cef = "2.3"
kurogane = { path = "kurogane" }
kurogane-cli = { path = "kurogane-cli" }
kurogane-layout = { path = "kurogane-layout" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
