[workspace]
resolver = "3"
members = [
    "kurogane",
    "kurogane-build",
    "kurogane-cli",
    "kurogane-layout",
    "kurogane-suite"
]

[workspace.package]
version = "0.0.6-alpha.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = [
    "Piyush Raj <hello@piyushraj.org>"
]
repository = "https://github.com/0x48piraj/kurogane"

[workspace.dependencies]
tanso = { version = "=154.4.0", git = "https://github.com/kurogane-rs/tanso", rev = "b946486f4d025ffd2828773cede4e72f54833c4d", default-features = false }
tanso-sys = { version = "=154.4.0", git = "https://github.com/kurogane-rs/tanso", rev = "b946486f4d025ffd2828773cede4e72f54833c4d" }
tanso-download = { version = "3.0.0", git = "https://github.com/kurogane-rs/tanso", rev = "b946486f4d025ffd2828773cede4e72f54833c4d" }
tanso-build = { version = "=154.4.0", git = "https://github.com/kurogane-rs/tanso", rev = "b946486f4d025ffd2828773cede4e72f54833c4d" }
kurogane = { version = "=0.0.6-alpha.2", path = "kurogane" }
kurogane-build = { version = "=0.0.6-alpha.2", path = "kurogane-build" }
kurogane-cli = { path = "kurogane-cli" }
kurogane-layout = { version = "=0.0.6-alpha.2", path = "kurogane-layout" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
