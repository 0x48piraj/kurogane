[graph]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "Pinned CEF-rs revision requires plist 1.9.0 and quick-xml 0.39.x." },
    { id = "RUSTSEC-2026-0195", reason = "Pinned CEF-rs revision requires plist 1.9.0 and quick-xml 0.39.x." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# CEF releases lag the versions Kurogane targets, so this dependency is pinned
# to a Git revision. Changes to the pinned revision can affect Kurogane's API.
allow-git = [
    "https://github.com/kurogane-rs/tetsu",
]
