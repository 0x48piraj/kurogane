[package]
name = "kurogane"
description = "A composable Chromium runtime for Rust"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The offscreen frame ring
gpu-frames = [
    "dep:ash",
    "dep:objc2-core-foundation",
    "dep:objc2-io-surface",
    "dep:objc2-metal",
    "dep:windows",
]

[dependencies]
kurogane-layout.workspace = true
tanso.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
mime_guess = "=2.0.5"
url = "2.5.8"
percent-encoding = "2.3.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
unicode-normalization = "0.1.25"
raw-window-handle = "0.6.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", optional = true }
libc = "0.2"
x11-dl = "2.21.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSString", "NSURL"] }
objc2-io-surface = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2", "objc2-core-foundation", "IOSurfaceRef", "IOSurfaceTypes"] }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2-io-surface", "block2", "MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }

[lints]
workspace = true
