name: CI

# Fast checks run on every change.
# Runtime checks are gated because CEF builds are expensive.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Platform-independent formatting check
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Fast cross-platform checks without CEF
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Clippy
        run: cargo clippy -p kurogane-layout -p kurogane-cli --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p kurogane-layout -p kurogane-cli --locked

  # Expensive runtime checks with CEF download, CMake/Ninja C++ build
  runtime:
    name: runtime (${{ matrix.os }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # CEF_PATH is both the install root and CI cache root
      CEF_PATH: ${{ github.workspace }}/.cef

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libnss3-dev libnspr4-dev \
            libasound2-dev libcups2-dev libdrm-dev libgbm-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            libxkbcommon-dev libxss-dev libxtst-dev libwayland-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake ninja; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-${{ matrix.os }}

      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cef
          key: cef-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Create CEF cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.cef"

      - name: Fetch dependencies
        run: cargo fetch --locked

      # Integration examples require a display server, so runtime tests are library-only
      - name: Test runtime
        run: cargo test -p kurogane --lib --locked

      # Compile-only coverage for platform-specific examples
      - name: Build examples
        run: cargo build -p kurogane-tests --examples --locked

      - name: Clippy
        continue-on-error: true
        run: cargo clippy -p kurogane --all-targets --locked -- -D warnings
