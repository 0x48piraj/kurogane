name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Verify the declared MSRV against CEF-free crates
  msrv:
    name: msrv (1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo fetch --locked
      - run: cargo check -p kurogane-layout -p kurogane-cli -p kurogane-build --all-targets --locked

  # Check advisories, licenses, bans and dependency sources
  # Note: tanso's git dependencies are outside advisory coverage; see deny.toml
  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Fast cross-platform checks without CEF
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Clippy
        run: cargo clippy -p kurogane-layout -p kurogane-cli -p kurogane-build --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p kurogane-layout -p kurogane-cli --locked

  # The runtime crates on each platform; builds and tests read no CEF and
  # link nothing beyond the C library (libcef is loaded when an app starts)
  runtime:
    name: runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-${{ matrix.os }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      # Library tests and doctests; the suite's examples require a display
      - name: Test runtime
        run: cargo test -p kurogane --locked

      # Compile-only coverage for platform-specific examples
      - name: Build examples
        run: cargo build -p kurogane-suite --examples --locked

      - name: Clippy
        run: cargo clippy -p kurogane -p kurogane-suite --all-targets --locked -- -D warnings

  # Boot a real Chromium under a virtual display and check the process model
  # end to end: the runtime starts, a renderer appears, and the sandbox policy
  # the application asked for is the one the renderer really runs under.
  # sandbox-smoke exits 0 when they agree, 1 when they do not or no renderer
  # appears, 2 when the runtime refuses to start.
  smoke:
    name: smoke (sandbox)
    if: github.event_name != 'push' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke

      # CEF version follows tanso-sys in the lock
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/tanso/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Chromium's own libraries, plus a virtual display for the window.
      # The library list is the one this workflow used before the runtime
      # stopped linking CEF; the -dev names survive Ubuntu 24.04's t64
      # transition unchanged.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-dev libnss3-dev libnspr4-dev \
            libasound2-dev libcups2-dev libdrm-dev libgbm-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            libxkbcommon-dev libxss-dev libxtst-dev libwayland-dev

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build the CLI and the smoke scenario
        run: |
          cargo build -p kurogane-cli --locked
          cargo build -p kurogane-suite --example sandbox-smoke --locked

      # The runtime loads libcef when an application starts, so the smoke run
      # needs the same Chromium `kurogane dev` would install
      - name: Install the Chromium runtime
        run: '"$GITHUB_WORKSPACE/target/debug/kurogane" install'

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which is what Chromium's sandbox needs here. The setuid helper is not
      # usable either, so lift the restriction rather than skip the check.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns

      - name: Smoke (unsandboxed)
        run: xvfb-run -a target/debug/examples/sandbox-smoke
        env:
          KUROGANE_SMOKE_SANDBOX: disabled

      - name: Smoke (Chromium sandbox)
        run: xvfb-run -a target/debug/examples/sandbox-smoke
        env:
          KUROGANE_SMOKE_SANDBOX: chromium

  # Generate each official starter from its default branch with this CLI and
  # bundle against checkout's Kurogane
  starters:
    name: starter (${{ matrix.starter }}, ${{ matrix.language }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        starter: [minimal, react, svelte, vue]
        language: [typescript, javascript]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: Swatinem/rust-cache@v2
        with:
          key: starters

      # CEF version follows tanso-sys in the lock
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/tanso/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the CLI
        run: cargo build -p kurogane-cli --locked

      - name: Generate the starter
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/target/debug/kurogane" new ${{ matrix.starter }} \
            --name app --language ${{ matrix.language }} --yes --ci

      - name: Build on this checkout's Kurogane
        working-directory: ${{ runner.temp }}/app
        run: |
          cargo add kurogane --path "$GITHUB_WORKSPACE/kurogane"
          cargo add --build kurogane-build --path "$GITHUB_WORKSPACE/kurogane-build"

      - name: Install the frontend
        working-directory: ${{ runner.temp }}/app
        run: npm --prefix frontend install

      - name: Bundle
        working-directory: ${{ runner.temp }}/app
        run: '"$GITHUB_WORKSPACE/target/debug/kurogane" bundle --ci'

  # Evaluation-only Nix sanity check
  nixEval:
    name: nix flake eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate Nix Flake
        run: nix flake check --no-build

  # Check offline bundling of the package, tests, CEF archive and nix/fixture
  # using the packaged CLI and Nix store's CEF
  nixChecks:
    name: nix flake checks (${{ matrix.system }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Ensure the runner matches the system under test
      - name: Confirm runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"

      - name: Check Nix Flake
        run: nix flake check
